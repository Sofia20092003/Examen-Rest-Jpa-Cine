spring.application.name=ExamenRestJpaCine

# ==============================================================
# CONFIGURACIÓN DEL DATASOURCE (MYSQL PUERTO 8889)
# ==============================================================
spring.datasource.url=jdbc:mysql://localhost:8889/cineBd?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==============================================================
# Crea las tablas al arrancar y las destruye al finalizar
spring.jpa.hibernate.ddl-auto=update

# Muestra y da formato a las consultas SQL ejecutadas por consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================================================
# CARGA DE SCRIPTS SQL (data.sql)
# ==============================================================
# Fuerza la ejecución de los scripts de inicialización SQL
spring.sql.init.mode=always
# Asegura que data.sql se ejecute DESPUÉS de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true

